<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StuyOverflow</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background-color: #c9dcee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    text-align: center;
  }

  .logo {
    font-family: "Brush Script MT", "Lucida Handwriting", cursive;
    font-size: 64px;
    color: #4a4a4a;
    margin-bottom: 24px;
  }

  .message {
    font-size: 16px;
    color: #222;
    margin-bottom: 20px;
  }

  .login-button {
    display: inline-block;
    width: 448px;
    max-width: 90vw;
    padding: 16px 0;
    background-color: #ffffff;
    color: #222;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.25);
    cursor: pointer;
    border: none;
  }

  .login-button:hover {
    background-color: #f5f5f5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">StuyOverflow</div>
    <div class="message">Successfully logged out.</div>
    <a href="#" class="login-button">Log back in</a>
  </div>
</body>
</html>
