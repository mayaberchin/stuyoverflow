<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StuyOverflow — Resources</title>
<style>
:root{
  /* Tab state equation (shared by all pages): a class tab is just its base color (--c) shown at one of three strengths.
     faded = --tab-fade, hover = --tab-hover, selected = --tab-on. New classes only need a color; text color is picked automatically. */
  --tab-fade:.3; --tab-hover:.6; --tab-on:1;
  --nav:#2f2f2f; --bg:#f3f5fa; --ink:#232733; --muted:#6b7280; --line:#dfe5ee;
  --red:#ef3b34; --blue:#4a86c8;
  --graphics:#8b27c4; --cyber:#173a5e; --ethics:#ef1fb0;
  --cat:var(--graphics);
  --shadow:0 1px 3px rgba(20,30,60,.10),0 4px 14px rgba(20,30,60,.06);
  --shadow-hover:0 12px 28px rgba(20,30,60,.20),0 3px 8px rgba(20,30,60,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{min-height:100vh;display:flex;flex-direction:column;font-family:Calibri,Carlito,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.topnav{height:58px;background:var(--nav);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.25);position:sticky;top:0;z-index:5}
.logo{font-family:"Brush Script MT","Segoe Script",cursive;font-size:28px;color:#fff;cursor:pointer;background:none;border:none}
.navlinks{display:flex;gap:22px;color:#d6d6d6;font-size:15px}
.navlinks{gap:34px}
.navlinks a{position:relative;height:58px;display:flex;align-items:center;padding:0 2px}
.navlinks .active{color:#fff;font-weight:600}
.navlinks .active::after{content:"";position:absolute;left:50%;bottom:14px;width:100%;height:2px;background:#fff;transform:translateX(-50%)}
.navlinks .myclasses{display:none}.navlinks .myclasses.show{display:flex}
.navright{display:flex;align-items:center;gap:12px;justify-self:end}
.btn{border:none;color:#fff;padding:9px 18px;border-radius:6px;font-weight:600;font-size:14px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.btn-ask{background:var(--red)}
.btn-join{background:var(--blue)}
.btn{white-space:nowrap;flex-shrink:0;line-height:1.2;align-self:center}
.navright{flex-shrink:0}
.logo{flex-shrink:0;justify-self:start;text-align:left;padding:0}
.avatar{width:34px;height:34px;border-radius:50%;background:#fff}


.page{flex:1;width:100%;padding:26px 40px 56px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{position:relative;top:0;border:none;padding:10px 26px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.3px;background:var(--c);color:var(--ink,#fff);box-shadow:var(--shadow);opacity:var(--tab-fade);transition:opacity .3s ease,top .3s ease,box-shadow .3s ease}
.chip:hover{opacity:var(--tab-hover);top:-2px;box-shadow:var(--shadow-hover)}
.chip.on{opacity:var(--tab-on);box-shadow:var(--shadow-hover)}
.view-toggle{margin-left:auto;position:relative;display:grid;grid-template-columns:1fr 1fr;background:#e4eaf3;padding:4px;border-radius:20px}
.view-toggle::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:16px;box-shadow:var(--shadow);transition:transform .55s cubic-bezier(.4,0,.2,1)}
.view-toggle.teacher::before{transform:translateX(100%)}
.view-toggle button{position:relative;z-index:1;border:none;background:transparent;padding:8px 18px;border-radius:16px;font-size:13px;font-weight:600;color:#4a5a6a;white-space:nowrap;transition:color .55s ease}
.view-toggle button.active{color:var(--ink)}

/* sections */
.sec{border-top:1px solid var(--line);scroll-margin-top:74px}
.sec:last-child{border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:center;gap:12px;padding:15px 6px;cursor:pointer;user-select:none}
.handle{color:#9aa7b3;font-size:18px;cursor:grab}
.sec-title{font-weight:700;font-size:14.5px;letter-spacing:.3px;text-transform:uppercase}
.chev{margin-left:auto;color:#555;font-size:14px;transition:transform .3s ease}
.sec.open .chev{transform:rotate(180deg)}
.sec-body{display:none;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px;padding:6px 4px 26px}
.sec.open .sec-body{display:grid}

.rcard{background:#fff;border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);position:relative;top:0;transition:top .3s ease,box-shadow .3s ease;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.rcard:hover{top:-2px;box-shadow:var(--shadow-hover)}
.rcard h4{margin:0;font-size:16px}
.rcard p{margin:0;font-size:14px;line-height:1.45;color:#444}
.rcard .by{font-size:12.5px;color:var(--muted)}
.rtag{align-self:flex-start;margin-top:auto;color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:3px 10px;border-radius:4px}

.upload{border:2px dashed #6f9bd1;background:#dcebfa;border-radius:14px;display:grid;place-items:center;min-height:118px;color:#3b6aa8;cursor:pointer;position:relative;top:0;transition:top .3s ease,box-shadow .3s ease,background .3s ease}
.upload:hover{top:-2px;background:#cfe2f7;box-shadow:var(--shadow-hover)}
.upload svg{width:46px;height:46px;display:block;fill:currentColor}

@media(max-width:700px){.head{gap:10px}.view-toggle{margin-left:0}.page{padding:20px 16px 48px}}
@media(max-width:1120px){.topnav{display:flex;gap:28px}.navlinks{gap:24px;min-width:0;overflow-x:auto;scrollbar-width:none}.navright{margin-left:auto}}
@media(max-width:560px){.topnav{padding:0 12px;gap:14px}.navlinks{gap:14px;font-size:14px}.btn{padding:7px 12px}}
.navlinks.drag{cursor:grab;user-select:none;-webkit-user-select:none}
.navlinks.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent)}
.navlinks.fade-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 30px),transparent)}
.navlinks.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 30px,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to right,transparent,#000 30px,#000 calc(100% - 30px),transparent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


/* profile menu */
.profile{position:relative;flex-shrink:0}
.avatar{border:none;padding:0;cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:700;color:#2f2f2f;overflow:hidden;transition:box-shadow .2s ease}
.avatar:hover,.avatar[aria-expanded="true"]{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:250px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--shadow-hover);padding:8px;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s;z-index:30}
.menu.open{opacity:1;visibility:visible}
.menu-head{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head b{display:block;font-size:15px}
.menu-head span{font-size:12.5px;color:var(--muted)}
.menu a{display:block;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--ink)}
.menu a:hover{background:#eef2f8}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 0}
.menu a.danger{color:#c62828}
.menu a.danger:hover{background:#fdecec}

/* mobile nav: logo + buttons + avatar on row 1, tabs scroll on row 2 */
@media(max-width:700px){
  .topnav{height:auto;flex-wrap:wrap;padding:8px 12px 0;gap:0 10px}
  .topnav>.logo,.topnav>.navright{height:46px;display:flex;align-items:center}
  .logo{font-size:25px}
  .navright{margin-left:auto;gap:8px}
  .btn{padding:7px 12px;font-size:13px}
  .navlinks{order:3;flex:1 0 100%;width:100%;gap:22px;font-size:14px}
  .navlinks a{height:40px}
  .navlinks a.active::after{bottom:4px}
}

@media(max-width:700px){
  .page{padding:18px 14px 44px}
  .chips{gap:8px}
  .chip{padding:8px 16px;font-size:12px}
  .view-toggle{width:100%}
  .sec{scroll-margin-top:112px}
  .sec-body{gap:14px}
}

/* upload dialog */
.upload.over{background:#cfe2f7;border-color:#3b6aa8}
.dlg{border:none;border-radius:16px;padding:0;width:min(92vw,480px);box-shadow:0 20px 60px rgba(20,30,60,.35);color:var(--ink);font-family:inherit}
.dlg::backdrop{background:rgba(20,30,60,.45)}
.dlg form{padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:18px}
.drop{border:2px dashed #6f9bd1;background:#eef5fd;border-radius:12px;padding:20px;text-align:center;color:#3b6aa8;cursor:pointer;transition:background .2s,border-color .2s;font-size:13.5px}
.drop:hover,.drop.over{background:#dcebfa;border-color:#3b6aa8}
.drop b{display:block;font-size:15px;margin-bottom:2px}
.drop .fn{margin-top:8px;color:var(--ink);font-weight:600;word-break:break-all}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff}
.field textarea{resize:vertical;min-height:70px}
.progress{height:8px;border-radius:5px;background:#dfe4ec;overflow:hidden;display:none}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}
.err{color:#c62828;font-size:13px}
.err:empty{display:none}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px}
.dlg-actions button{border:none;border-radius:8px;padding:9px 20px;font-weight:600;font-size:14px}
.btn-cancel{background:#e5e7eb;color:#444}
.btn-go{background:var(--blue);color:#fff}
.btn-go:disabled{opacity:.5;cursor:not-allowed}
.rcard.new{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--blue)}100%{box-shadow:var(--shadow)}}
</style>
</head>
<body>

<header class="topnav">
  <a class="logo" href="{{ url_for('home') }}">StuyOverflow</a>
  <nav class="navlinks">
    <a href="{{ url_for('home') }}">Q&amp;A</a>
    <a href="{{ url_for('calendar') }}">Calendar</a>
    <a class="active" href="{{ url_for('resources') }}">Resources</a>
    <a href="{{ url_for('skills') }}">Skills</a>
  </nav>
  <div class="navright">
    <button class="btn btn-ask">Ask Question</button>
    <button class="btn btn-join">Join Class</button>
    <div class="profile" data-name="Frist Lsat" data-email="flast@example.com" data-picture="">
      <!-- Set data-name, data-email and data-picture on .profile. Initials show by default; if data-picture is set and loads, the picture replaces them. -->
      <button class="avatar" id="avatarBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu" aria-label="Account menu">FL</button>
      <div class="menu" id="profileMenu" role="menu" aria-hidden="true">
        <div class="menu-head"><b>Frist Lsat</b><span>flast@example.com</span></div>
        <a role="menuitem" href="#">My profile</a>
        <a role="menuitem" href="#">Account settings</a>
        <a role="menuitem" href="#">Help &amp; support</a>
        <hr>
        <a role="menuitem" class="danger" href="#">Log out</a>
      </div>
    </div>
  </div>
</header>

<div class="page">
  <div class="head">
    <div class="chips" id="chips"></div>
    <div class="view-toggle" id="viewToggle">
      <button id="studentBtn" class="active">Student view</button>
      <button id="teacherBtn">Teacher view</button>
    </div>
  </div>
  <div id="sections"></div>
</div>

<dialog class="dlg" id="uploadDlg" aria-labelledby="dlgTitle">
  <form id="uploadForm" novalidate>
    <h3 id="dlgTitle">Upload to <span id="dlgCat"></span></h3>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a file">
      <b>Drop a file here or click to browse</b><span>Up to 25 MB</span>
      <div class="fn" id="fileName"></div>
      <input type="file" id="fileInput" hidden>
    </div>
    <div class="field"><label for="upTitle">Title</label><input id="upTitle" maxlength="120"></div>
    <div class="field"><label for="upDesc">Description</label><textarea id="upDesc" maxlength="300" placeholder="Brief description of what this is for."></textarea></div>
    <div class="progress" id="prog"><i></i></div>
    <div class="err" id="upErr" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="btn-cancel" id="upCancel">Cancel</button><button type="submit" class="btn-go" id="upGo">Upload</button></div>
  </form>
</dialog>

<script>
/* Picks readable text (white or dark) for any class color, e.g. one coming from the database. */
function inkOn(hex){ let h=String(hex).replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); const y=((n>>16&255)*299+((n>>8)&255)*587+(n&255)*114)/1000; return y>=150?"#1b1f2a":"#fff"; }
const CATS = [
  {id:"saved",      name:"Saved",         color:"#3e6fb5"},
  {id:"schoolwide", name:"Schoolwide",    color:"#000000"},
  {id:"graphics",   name:"Graphics",      color:"#8b27c4"},
  {id:"cyber",      name:"Cybersecurity", color:"#173a5e"},
  {id:"ethics",     name:"Ethics",        color:"#ef1fb0"}
];
const COUNTS = {schoolwide:8, graphics:10, cyber:10, ethics:10};
const mk = (cat,i) => ({cat, title:"Titlt etitle lkajsdflkjaoieoipowqeior", desc:"Brief description of what this is for. Lksdfnecnlsdnlkeonvai", by:"Frist Lsat"});
const RES = {};
Object.keys(COUNTS).forEach(c => RES[c] = Array.from({length:COUNTS[c]}, (_,i)=>mk(c,i)));
RES.saved = [RES.schoolwide[0], RES.graphics[0]];

/* Replace with your own upload SVG (uses currentColor). */
const UPLOAD_ICON = `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 10 22h9v12h10V22h9L24 6z"/><rect x="10" y="38" width="28" height="4" rx="2"/></svg>`;

let teacher = false;
const openSec = {saved:true};
const $ = id => document.getElementById(id);
/* Upload settings. UPLOAD_URL = "" runs in demo mode (files stay in this page only).
   Set it to your Flask route, e.g. "/resources/upload", to send files to the server. */
const UPLOAD_URL = "";
const MAX_MB = 25;
const esc = t => String(t).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const color = id => CATS.find(c=>c.id===id).color;
const label = id => CATS.find(c=>c.id===id).name;

function cardHTML(r){
  return `<article class="rcard ${r.fresh?"new":""}" tabindex="0" data-url="${esc(r.url||"")}">
    <h4>${esc(r.title)}</h4><p>${esc(r.desc)}</p><div class="by">By ${esc(r.by)}${r.file?` &middot; ${esc(r.file)}`:""}</div>
    <span class="rtag" style="background:${color(r.cat)};color:${inkOn(color(r.cat))}">${label(r.cat).toUpperCase()}</span>
  </article>`;
}

function render(){
  $("sections").innerHTML = CATS.map(c=>{
    const list = RES[c.id];
    const upload = teacher && c.id!=="saved" ? `<button class="upload" data-cat="${c.id}" aria-label="Upload a resource to ${c.name}">${UPLOAD_ICON}</button>` : "";
    return `<section class="sec ${openSec[c.id]?"open":""}" id="sec-${c.id}" data-id="${c.id}">
      <div class="sec-head" role="button" tabindex="0" aria-expanded="${!!openSec[c.id]}">
        <span class="handle">&#9776;</span>
        <span class="sec-title">${c.name} (${list.length})</span>
        <span class="chev">&#8964;</span>
      </div>
      <div class="sec-body">${upload}${list.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
  $("sections").querySelectorAll(".sec-head").forEach(h=>{
    const go = ()=>{ const sec=h.parentElement, id=sec.dataset.id; openSec[id]=!openSec[id]; sec.classList.toggle("open",openSec[id]); h.setAttribute("aria-expanded",openSec[id]); };
    h.onclick = go;
    h.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
}

$("chips").innerHTML = CATS.map(c=>`<button data-id="${c.id}" class="chip ${c.id==="saved"?"on":""}" style="--c:${c.color};--ink:${inkOn(c.color)}">${c.name.toUpperCase()}</button>`).join("");
$("chips").onclick = e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  const id = b.dataset.id;
  openSec[id] = true;
  const sec = $("sec-"+id);
  sec.classList.add("open"); sec.querySelector(".sec-head").setAttribute("aria-expanded","true");
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));
  sec.scrollIntoView({behavior:"smooth", block:"start"});
};

function setView(t){
  teacher = t;
  $("studentBtn").classList.toggle("active",!t);
  $("teacherBtn").classList.toggle("active",t);
  $("viewToggle").classList.toggle("teacher",t);
  render();
}
$("studentBtn").onclick = ()=>setView(false);
$("teacherBtn").onclick = ()=>setView(true);
render();


/* ---- uploads ---- */
const dlg=$("uploadDlg"), upForm=$("uploadForm"), fileInput=$("fileInput"), drop=$("drop"), prog=$("prog");
let upCat=null, upFile=null, xhr=null;
const fmtSize = n => n<1048576 ? Math.max(1,Math.round(n/1024))+" KB" : (n/1048576).toFixed(1)+" MB";

function setFile(f){
  $("upErr").textContent="";
  if(!f){ upFile=null; $("fileName").textContent=""; return; }
  if(f.size > MAX_MB*1048576){ upFile=null; $("fileName").textContent=""; $("upErr").textContent="That file is "+fmtSize(f.size)+". The limit is "+MAX_MB+" MB."; return; }
  upFile=f; $("fileName").textContent=f.name+" ("+fmtSize(f.size)+")";
  if(!$("upTitle").value.trim()) $("upTitle").value=f.name.replace(/\.[^.]+$/,"");
}
function openUpload(cat, file){
  upCat=cat; upForm.reset(); $("dlgCat").textContent=label(cat);
  prog.style.display="none"; prog.firstElementChild.style.width="0"; $("upGo").disabled=false;
  setFile(file||null);
  if(!dlg.open) dlg.showModal();
}
function failUpload(msg){ $("upErr").textContent=msg; $("upGo").disabled=false; prog.style.display="none"; }
function addResource(cat, r){
  const me = (document.querySelector(".profile")||{dataset:{}}).dataset.name || "You";
  const item = {cat, title:r.title, desc:r.description||"", by:r.by||me, file:r.file||"", url:r.url||"", fresh:true};
  RES[cat].unshift(item); openSec[cat]=true; render();
  item.fresh=false;
  const el=document.querySelector("#sec-"+cat+" .rcard.new"); if(el) el.scrollIntoView({block:"nearest",behavior:"smooth"});
}

upForm.addEventListener("submit", e=>{
  e.preventDefault();
  const title=$("upTitle").value.trim(), desc=$("upDesc").value.trim();
  if(!upFile){ $("upErr").textContent="Choose a file first."; return; }
  if(!title){ $("upErr").textContent="Give it a title."; $("upTitle").focus(); return; }
  $("upErr").textContent=""; $("upGo").disabled=true;
  const finish = extra => { addResource(upCat, Object.assign({title:title, description:desc, file:upFile.name}, extra||{})); dlg.close(); };
  if(!UPLOAD_URL){ finish({url:URL.createObjectURL(upFile)}); return; }
  const fd=new FormData();
  fd.append("file",upFile); fd.append("title",title); fd.append("description",desc); fd.append("category",upCat);
  prog.style.display="block";
  xhr=new XMLHttpRequest(); xhr.open("POST",UPLOAD_URL);
  const csrf=document.querySelector('meta[name="csrf-token"]'); if(csrf) xhr.setRequestHeader("X-CSRFToken",csrf.content);
  xhr.upload.onprogress = ev=>{ if(ev.lengthComputable) prog.firstElementChild.style.width=(ev.loaded/ev.total*100)+"%"; };
  xhr.onload = ()=>{
    if(xhr.status>=200 && xhr.status<300){ let r=null; try{ r=JSON.parse(xhr.responseText); }catch(_){ r=null; } finish(r); }
    else failUpload("Upload failed (error "+xhr.status+").");
  };
  xhr.onerror = ()=>failUpload("Network error. Please try again.");
  xhr.send(fd);
});
$("upCancel").onclick = ()=>dlg.close();
dlg.addEventListener("close", ()=>{ if(xhr){ xhr.abort(); xhr=null; } });
dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); });

drop.addEventListener("click", ()=>fileInput.click());
drop.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener("click", e=>e.stopPropagation());
fileInput.addEventListener("change", ()=>setFile(fileInput.files[0]));
drop.addEventListener("dragover", e=>{ e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", ()=>drop.classList.remove("over"));
drop.addEventListener("drop", e=>{ e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); });

const secs=$("sections");
secs.addEventListener("click", e=>{
  const up=e.target.closest(".upload"); if(up){ openUpload(up.dataset.cat); return; }
  const card=e.target.closest(".rcard"); if(card && card.dataset.url) window.open(card.dataset.url,"_blank","noopener");
});
secs.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList.contains("rcard") && e.target.dataset.url) window.open(e.target.dataset.url,"_blank","noopener");
});
secs.addEventListener("dragover", e=>{ const up=e.target.closest(".upload"); if(up){ e.preventDefault(); up.classList.add("over"); } });
secs.addEventListener("dragleave", e=>{ const up=e.target.closest(".upload"); if(up) up.classList.remove("over"); });
secs.addEventListener("drop", e=>{
  const up=e.target.closest(".upload"); if(!up) return;
  e.preventDefault(); up.classList.remove("over");
  const f=e.dataTransfer.files[0]; if(f) openUpload(up.dataset.cat, f);
});

/* ---- top nav: drag to scroll + hover edges to scroll (only matters when the tabs overflow) ---- */
(function(){
  const nav=document.querySelector(".navlinks"); if(!nav) return;
  nav.classList.add("drag");
  let down=false, moved=false, startX=0, startLeft=0, vel=0, raf=0;
  function fades(){
    const max=nav.scrollWidth-nav.clientWidth;
    nav.classList.toggle("fade-l", max>1 && nav.scrollLeft>2);
    nav.classList.toggle("fade-r", max>1 && nav.scrollLeft<max-2);
  }
  function tick(){
    if(vel && !down){ const b=nav.scrollLeft; nav.scrollLeft+=vel; raf = nav.scrollLeft!==b ? requestAnimationFrame(tick) : 0; }
    else raf=0;
  }
  nav.addEventListener("dragstart", e=>e.preventDefault());
  nav.addEventListener("pointerdown", e=>{
    if(e.pointerType!=="mouse" || e.button!==0) return;
    down=true; moved=false; startX=e.clientX; startLeft=nav.scrollLeft;
  });
  window.addEventListener("pointermove", e=>{
    if(!down) return;
    const dx=e.clientX-startX;
    if(Math.abs(dx)>4){ moved=true; nav.style.cursor="grabbing"; }
    nav.scrollLeft=startLeft-dx;
  });
  window.addEventListener("pointerup", ()=>{ down=false; nav.style.cursor=""; });
  nav.addEventListener("click", e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; } }, true);
  nav.addEventListener("pointermove", e=>{
    if(e.pointerType!=="mouse" || down) return;
    if(nav.scrollWidth<=nav.clientWidth){ vel=0; return; }
    const r=nav.getBoundingClientRect(), z=Math.min(90, r.width*.3), x=e.clientX-r.left;
    vel = x>r.width-z ? 1+((x-(r.width-z))/z)*7 : x<z ? -(1+((z-x)/z)*7) : 0;
    if(vel && !raf) raf=requestAnimationFrame(tick);
  });
  nav.addEventListener("pointerleave", ()=>{ vel=0; });
  nav.addEventListener("scroll", fades, {passive:true});
  window.addEventListener("resize", fades);
  new MutationObserver(fades).observe(nav,{attributes:true,subtree:true,attributeFilter:["class"]});
  fades();
})();

/* ---- profile dropdown ---- */
(function(){
  const btn=document.getElementById("avatarBtn"), menu=document.getElementById("profileMenu"); if(!btn||!menu) return;
  const box=btn.closest(".profile"), name=(box.dataset.name||"").trim(), email=(box.dataset.email||"").trim(), pic=(box.dataset.picture||"").trim();
  const head=menu.querySelector(".menu-head");
  if(name) head.querySelector("b").textContent=name;
  if(email) head.querySelector("span").textContent=email;
  const parts=name.split(/\s+/).filter(Boolean);
  const initials=(parts.length>1 ? parts[0][0]+parts[parts.length-1][0] : (parts[0]||"").slice(0,2)).toUpperCase();
  if(initials) btn.textContent=initials;
  if(pic){ const img=new Image(); img.alt=""; img.onload=()=>{ btn.textContent=""; btn.appendChild(img); }; img.src=pic; }
  function set(o){ menu.classList.toggle("open",o); btn.setAttribute("aria-expanded",o); menu.setAttribute("aria-hidden",!o); }
  btn.addEventListener("click", e=>{ e.stopPropagation(); set(!menu.classList.contains("open")); });
  document.addEventListener("click", e=>{ if(!menu.contains(e.target)) set(false); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") set(false); });
})();
</script>
